# Single-host deployment (home machine, no Swarm, no Traefik).
#
#   cp .env.example .env   # fill in BASIC_AUTH_*, set BIND_ADDR to the host's Tailscale IP
#   docker compose up -d --build
#
# Not exposed to the internet: the port is published only on BIND_ADDR, which
# defaults to 127.0.0.1 (unreachable from other machines) until you set it to the
# host's Tailscale address (100.x.y.z). n8n then calls http://<tailscale-host>:3000
# with basic auth. No router port forwarding is involved.
#
# Update yt-dlp: bump YTDLP_VERSION in .env (or pass --build-arg) and run
#   docker compose build && docker compose up -d
services:
  youtube-api:
    build:
      context: .
      args:
        YTDLP_VERSION: ${YTDLP_VERSION:-2026.08.19}
    image: youtube-api-service:latest
    env_file: .env
    environment:
      # The container always listens on 3000; choose the host port via HOST_PORT.
      PORT: "3000"
      TOKEN_PATH: /data/tokens.json
      # Local LLM (llama-server) runs on the HOST; host.docker.internal resolves to it
      # via the extra_hosts entry below. Override in .env if the LLM runs elsewhere.
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:8000/v1}
      # Obsidian notes: one Markdown file per summary, synced into the vault by the
      # syncthing service below. Empty value disables the export.
      OBSIDIAN_EXPORT_DIR: ${OBSIDIAN_EXPORT_DIR-/data/obsidian-inbox}
      # Summaries in English or German only: a transcript in another language is
      # summarised in English. Empty value = always the transcript language.
      SUMMARY_LANGUAGES: ${SUMMARY_LANGUAGES-en,de}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${HOST_PORT:-3000}:3000"
    volumes:
      # /data holds the transcript cache (/data/transcripts, one JSON file per
      # video+track) and, in full mode, tokens.json. Bind-mounted so the files are
      # readable from the host and survive rebuilds. The container runs as uid 1000:
      # create ./data as your normal user (or `chown 1000 data`) before the first
      # `up`, otherwise compose creates it root-owned and /health shows
      # cache.writable=false.
      - ./data:/data
      # yt-dlp cache (player/challenge data); speeds up repeated calls
      - ytdlp-cache:/home/node/.cache
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Syncthing carries ./data/obsidian-inbox into the Obsidian vault on another
  # device as a nested folder (see README "Obsidian notes"). GUI and sync port are
  # published on BIND_ADDR only (Tailscale IP → reachable from your other devices,
  # not from the internet). Pairing is done once in the two web UIs.
  syncthing:
    image: syncthing/syncthing:2
    hostname: ${SYNCTHING_DEVICE_NAME:-youtube-api}
    environment:
      PUID: "1000"
      PGID: "1000"
    volumes:
      - ./syncthing:/var/syncthing
      - ./data/obsidian-inbox:/var/syncthing/video-inbox
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${SYNCTHING_GUI_PORT:-8384}:8384"
      - "${BIND_ADDR:-127.0.0.1}:22000:22000/tcp"
      - "${BIND_ADDR:-127.0.0.1}:22000:22000/udp"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  ytdlp-cache:
